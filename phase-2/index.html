:root{

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased}

.sidebar-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sidebar-logo .sub{font-size:10px;font-weight:400;color:#5c6b7a;margin-left:auto}
.nav-group{padding:14px 16px 6px;font-size:11px;letter-spacing:.6px;color:#5c6b7a}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 24px;font-size:13px;cursor:pointer;transition:.15s;border:0;background:transparent;color:inherit;width:100%;text-align:left}
.nav-item:hover{color:#fff;background:rgb(255 255 255 / 6%)}
.nav-item.active{color:#fff;background:var(--primary)}
.nav-item.locked{opacity:.55}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.demo-bar{flex-shrink:0;background:#fff7e6;border-bottom:1px solid #f5dab1;color:#8a5a12;padding:6px 16px;font-size:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.demo-bar b{color:#ad6800}
.topbar{height:50px;background:#fff;border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.crumb{font-size:13px;color:var(--t2)}
.crumb b{color:var(--t1)}
.spacer{flex:1}
.role-select,.ctrl{height:28px;border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;background:#fff;color:var(--t1)}
.page{flex:1;overflow:auto;padding:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--t1);cursor:pointer;line-height:1}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn:disabled,.btn.disabled{opacity:.45;cursor:not-allowed;color:var(--t3);border-color:var(--border);background:#f5f7fa}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);color:#fff}
.btn-primary:disabled{background:#a0cfff;border-color:#a0cfff;color:#fff;opacity:1}
.btn-danger{color:var(--danger);border-color:#fbc4c4}
.btn-text{border:0;background:transparent;color:var(--primary);height:auto;padding:0 4px}
.btn-sm{height:26px;padding:0 8px;font-size:12px}
.input,.select,textarea.input{height:32px;border:1px solid var(--border);border-radius:var(--radius);padding:0 8px;min-width:140px;background:#fff}
textarea.input{height:auto;padding:8px;min-height:72px;width:100%;resize:vertical}
.input:focus,.select:focus,textarea.input:focus{outline:0;border-color:var(--primary)}
.label{font-size:12px;color:var(--t2);margin-right:4px}
.hint{font-size:12px;color:var(--t3)}
.err{font-size:12px;color:var(--danger);margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{background:var(--bg);border-radius:var(--radius);padding:10px 12px}
.stat .n{font-size:20px;font-weight:700;color:var(--t1)}
.stat .k{font-size:12px;color:var(--t3);margin-top:2px}
.obs-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border-light);text-align:left;vertical-align:middle}
table .ops,table th:last-child{position:sticky;right:0;background:#fff;z-index:1;box-shadow:-4px 0 8px rgb(0 0 0 / 4%)}
th{background:#fafafa;color:var(--t2);font-weight:600;white-space:nowrap}
td{color:var(--t1)}

.tag{display:inline-block;padding:0 6px;height:20px;line-height:20px;border-radius:2px;font-size:12px}
.tag-blue{background:var(--primary-light);color:var(--primary)}
.tag-green{background:var(--success-light);color:var(--success)}
.tag-orange{background:var(--warning-light);color:#b88230}
.tag-red{background:var(--danger-light);color:var(--danger)}
.tag-gray{background:var(--info-light);color:var(--t2)}
.tag-purple{background:#f5f0ff;color:#7c3aed}
.dash{color:var(--t4)}
.ellipsis{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border-light);margin-bottom:12px}
.tab{padding:8px 16px;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;background:transparent;border-top:0;border-left:0;border-right:0}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.mask{position:fixed;inset:0;background:rgb(0 0 0 / 45%);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.modal{background:#fff;border-radius:6px;width:720px;max-width:100%;max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / 18%)}
.modal-lg{width:860px}
.modal-sm{width:480px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:100%;background:#fff;z-index:50;box-shadow:-4px 0 16px rgb(0 0 0 / 12%);display:flex;flex-direction:column}
.drawer-h,.modal-h{height:50px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light);font-weight:600;flex-shrink:0}
.drawer-b,.modal-b{padding:16px;overflow:auto;flex:1}
.modal-f,.drawer-f{padding:10px 16px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.close-x{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--t3)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-item{display:flex;flex-direction:column;gap:4px}
.form-item.full{grid-column:1/-1}
.form-item label{font-size:13px;color:var(--t2)}
.form-item label em{color:var(--danger);font-style:normal;margin-right:2px}
.section-title{font-size:13px;font-weight:600;margin:8px 0 8px;padding-left:8px;border-left:3px solid var(--primary)}
.progress{height:6px;background:#ebeef5;border-radius:3px;overflow:hidden;min-width:80px}
.progress>i{display:block;height:100%;background:var(--primary)}
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-radius:4px;box-shadow:var(--shadow);padding:10px 16px;min-width:260px;border-left:3px solid var(--primary);font-size:13px}
.toast.ok{border-left-color:var(--success)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.empty{text-align:center;color:var(--t3);padding:40px 16px}
.switch{position:relative;width:36px;height:20px;display:inline-block}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:#dcdfe6;border-radius:10px;cursor:pointer;transition:.15s}
.switch i:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i:before{transform:translateX(16px)}
.switch input:disabled+i{opacity:.45;cursor:not-allowed}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:6px}
.member{display:flex;align-items:center}
.org-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border-light)}
.org-item.off{opacity:.5;background:#fafafa}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv .k{color:var(--t3)}
.tip{position:relative}
.tip:hover .tipbox{display:block}
.tipbox{display:none;position:absolute;left:0;bottom:120%;background:#303133;color:#fff;padding:6px 8px;border-radius:4px;font-size:12px;width:220px;z-index:5;white-space:normal}
.quota{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--t3);font-size:12px}
.ratio-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ratio-row .input{width:72px;min-width:72px}
.chip{padding:4px 10px;border:1px solid var(--border);border-radius:12px;cursor:pointer;font-size:12px;background:#fff}
.chip.on{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.ops a,.ops .btn-text{margin-right:6px}
.guide ol{padding-left:20px;line-height:1.8}
.guide h4{margin:16px 0 8px}
.warn-text{color:var(--danger)}
.ok-text{color:var(--success)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;color:var(--t3);font-size:12px}
.confirm-box{background:#fff;border-radius:6px;width:400px;padding:20px}
.offline{color:var(--danger)}
.online{color:var(--success)}

</head>

const state = {
  role:"admin",
  page:"tasks",
  now: new Date(BASE_NOW.getTime()),
  tasks: clone(seed.tasks),
  leads: clone(seed.leads),
  members: clone(seed.members),

  taskFilter:{name:"",channel:"",status:"",date:""},
  poolView:"全部客户",
  poolFilter:{fid:"",oid:"",phone:"",task:"",aiStatus:"",grade:"",flow:"",layer:"",wecom:""},
  poolPage:1,
  selected:new Set(),
  obsOpen:true,
  wecomTab:"members",
  orgFilter:"全部",
  wecomSaved:true
};

function usedConcurrency(){return state.tasks.filter(t=>t.status==="进行中").reduce((s,t)=>s+Number(t.concurrency||0),0);}
function freeConcurrency(){return Math.max(0,TOTAL_CONCURRENCY-usedConcurrency());}
function taskById(id){return state.tasks.find(t=>t.id===id);}
function progressOf(t){return t.plan?Math.min(100,Math.round(t.called/t.plan*100)):0;}
function tickClock(){document.getElementById("simClock").textContent=fmt(state.now)+(inPolicy(state.now)?"（政策禁呼）":"");}

function setPage(p,opts={}){
  if((p==="tasks"||p==="wecom") && !canConfig()){
    toast("当前角色无权进入该配置页","err");
    p="pool";
  }
  state.page=p;
  if(!opts.keepPoolPage) state.poolPage=1;
  render();
}

function render(){
  tickClock();
  const crumb={pool:"客户池",tasks:"人工智能外呼中心 / AI任务",wecom:"人工智能外呼中心 / 企微承接账号",guide:"人工智能外呼中心 / 系统说明"}[state.page];
  document.getElementById("crumb").innerHTML=`<b>${crumb}</b>`;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active",el.dataset.page===state.page));
  const root=document.getElementById("page");
  if(state.page==="tasks") root.innerHTML=renderTasks();
  else if(state.page==="pool") root.innerHTML=renderPool();
  else if(state.page==="wecom") root.innerHTML=renderWecom();
  else root.innerHTML=renderGuide();
  bindPage();
}

/* ---------- AI 任务 ---------- */
function runningTasks(){return state.tasks.filter(t=>t.status==="进行中");}
function queuedCount(){return runningTasks().reduce((s,t)=>s+Math.max(0,t.plan-t.called),0);}
function pendingAssign(){return state.leads.filter(l=>l.flow==="意向待分配").length;}
function todayCalled(){const day=fmt(state.now).slice(0,10);return state.tasks.filter(t=>fmt(new Date(t.start)).slice(0,10)===day).reduce((s,t)=>s+t.called,0);}
function connectRate(){const c=state.tasks.reduce((s,t)=>s+t.called,0),ok=state.tasks.reduce((s,t)=>s+t.connected,0);return c?Math.round(ok/c*100)+"%":"0%";}

function renderTasks(){
  const f=state.taskFilter;
  let list=state.tasks.filter(t=>{
    if(f.name && !t.name.includes(f.name) && !t.id.includes(f.name)) return false;
    if(f.channel && t.channel!==f.channel) return false;
    if(f.status && t.status!==f.status) return false;
    return true;
  });
  const run=runningTasks();
  return `
  <div class="card">
    <div class="obs-head" id="obsToggle"><h3 style="margin:0">实时观察</h3><span class="hint">${state.obsOpen?"收起":"展开"}</span></div>
    <div class="${state.obsOpen?"":"hidden"}" id="obsBody">
      <div class="stat-grid mt12">
        <div class="stat"><div class="n">${run.length}</div><div class="k">进行中任务</div></div>
        <div class="stat"><div class="n">${usedConcurrency()} / ${TOTAL_CONCURRENCY}</div><div class="k">已占用 / 可分配并发（可分配 ${freeConcurrency()}）</div></div>
        <div class="stat"><div class="n">${todayCalled()}</div><div class="k">今日已呼</div></div>
        <div class="stat"><div class="n">${connectRate()}</div><div class="k">接通率（演示）</div></div>
        <div class="stat"><div class="n">${queuedCount()}</div><div class="k">排队等待（按剩余计划估算）</div></div>
        <div class="stat"><div class="n">${pendingAssign()}</div><div class="k">意向待分配</div></div>
      </div>
      <p class="hint mt8">只汇总任务执行情况，不展示漏斗对比或通话抽样名单。待呼、正在外呼中的名单不在客户池展开。</p>
      ${run.length?`<table class="mt12"><thead><tr><th>任务名称</th><th>通道</th><th>并发占用</th><th>已呼 / 计划</th><th>接通率</th><th>意向</th><th>状态</th></tr></thead><tbody>
        ${run.map(t=>`<tr><td>${esc(t.name)}<div class="muted">${esc(t.id)}</div></td><td>${esc(t.channel)}</td><td>${t.concurrency}</td><td>${t.called} / ${t.plan}</td><td>${t.called?Math.round(t.connected/t.called*100)+"%":"0%"}</td><td>${t.intent}</td><td>${statusTag(t.status)}</td></tr>`).join("")}
      </tbody></table>`:""}
    </div>
  </div>
  <div class="card">
    <div class="toolbar mb12">
      <div class="row">
        <input class="input" id="tfName" placeholder="任务名称或编号" value="${esc(f.name)}">
        <select class="select" id="tfChannel"><option value="">全部通道</option><option ${f.channel==="火山"?"selected":""}>火山</option><option ${f.channel==="阿里"?"selected":""}>阿里</option></select>
        <select class="select" id="tfStatus"><option value="">全部状态</option>${["待开始","进行中","已暂停","已完成"].map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select>
        <button class="btn btn-primary" id="tfQuery">查询</button>
        <button class="btn" id="tfRefresh">刷新</button>
      </div>
      <button class="btn btn-primary" id="btnNewTask">新建AI外呼任务</button>
    </div>
    ${list.length?`<table><thead><tr><th>任务名称</th><th>任务时间</th><th>通道</th><th>计划量</th><th>已呼</th><th>接通</th><th>意向</th><th>进度</th><th>状态</th><th>操作</th></tr></thead><tbody>
      ${list.map(t=>`<tr>
        <td>${esc(t.name)}<div class="muted">${esc(t.id)}</div></td>
        <td>${esc(fmtRange(t.start,t.end))}</td>
        <td>${esc(t.channel)}</td>
        <td>${t.plan}</td>
        <td>${t.called||0}</td>
        <td>${t.connected||0}</td>
        <td>${t.intent||0}</td>
        <td><div class="progress"><i style="width:${progressOf(t)}%"></i></div><div class="muted">${progressOf(t)}%</div></td>
        <td>${statusTag(t.status)}</td>
        <td class="ops">
          <button class="btn-text" data-act="viewcust" data-id="${t.id}">查看客户</button>
          <button class="btn-text" data-act="detail" data-id="${t.id}">详情</button>
          <button class="btn-text" data-act="edit" data-id="${t.id}">编辑</button>
          ${t.status==="待开始"||t.status==="已暂停"?`<button class="btn-text" data-act="start" data-id="${t.id}">启动</button>`:""}
          ${t.status==="进行中"?`<button class="btn-text" data-act="pause" data-id="${t.id}">暂停</button>`:""}
        </td>
      </tr>`).join("")}
    </tbody></table>`:`<div class="empty">暂无 AI 外呼任务<br><button class="btn btn-primary mt12" id="btnNewTaskEmpty">新建AI外呼任务</button></div>`}
  </div>`;
}
function statusTag(s){const m={待开始:"tag-gray",进行中:"tag-blue",已暂停:"tag-orange",已完成:"tag-green"};return `<span class="tag ${m[s]||"tag-gray"}">${s}</span>`}
function flowTag(s){if(!s||s==="—")return dash("—");const m={"意向待分配":"tag-orange","已加微":"tag-green","已分配":"tag-blue","人工智能处理中":"tag-purple"};return `<span class="tag ${m[s]||"tag-gray"}">${s}</span>`}
function fmtRange(a,b){const x=new Date(a),y=new Date(b);return `${fmt(x)} 至 ${fmt(y).slice(11)}`;}

function startTask(id){
  const t=taskById(id); if(!t) return;
  if(t.status!=="待开始"&&t.status!=="已暂停") return;
  if(!enoughAgent(t)) {toast("请选择可用的通话智能体","err");return;}
  if(inPolicy(state.now)) toast("当前处于每日 21:00 至次日 09:00 的政策禁呼时段，已启动任务，但不会发起新的拨打","warn");
  else toast("任务已启动");
  if(!t.enough) toast("可用线索不足，将按实际可抽数量执行","warn");
  const onlineOn=state.members.some(m=>m.online&&m.on&&m.today<m.cap);
  if(!onlineOn) toast("当前没有在线可承接账号，任务仍可启动，加微阶段将跳过离线账号（该策略待确认）","warn");
  t.status="进行中";
  t.logs.push({t:fmt(state.now).slice(5),a:"启动"});
  render();
}
function pauseTask(id){
  const t=taskById(id); if(!t||t.status!=="进行中") return;
  t.status="已暂停";
  t.logs.push({t:fmt(state.now).slice(5),a:"暂停"});
  toast("已暂停。不再抽取新线索。已领出未打完的档次按剩余规则打完");
  render();
}
function enoughAgent(t){const list=AGENTS[t.channel]||[];return list.some(a=>a.id===t.agent&&a.ok);}
function viewCustomers(taskId){
  state.poolFilter.task=taskId;
  state.poolView="全部客户";
  state.selected=new Set();
  state.page="pool";
  state.poolPage=1;
  render();
  toast("已按任务筛选客户池");
}

function openTaskModal(editId){
  const t=editId?clone(taskById(editId)):null;
  const ratios=t?t.ratios:{A:5,B:15,C:5,D:5,E:70};
  const blocks=t&&t.blocks.length?clone(t.blocks):[];
  const start=t?t.start:todayStr(9,30);
  const end=t?t.end:todayStr(18,0);
  showModal(`
    <div class="modal modal-lg">
      <div class="modal-h"><span>${editId?"编辑 AI 外呼任务":"新建AI外呼任务"}</span><button class="close-x" data-close>×</button></div>
      <div class="modal-b">
        <div class="section-title">基本信息</div>
        <div class="form-grid">
          <div class="form-item"><label><em>*</em>任务名称</label><input class="input" id="fName" value="${esc(t?t.name:"")}"><div class="err" id="eName"></div></div>
          <div class="form-item"><label><em>*</em>通道</label><select class="select" id="fChannel"><option value="">请选择</option><option ${t&&t.channel==="火山"?"selected":""}>火山</option><option ${t&&t.channel==="阿里"?"selected":""}>阿里</option></select><div class="err" id="eChannel"></div></div>
          <div class="form-item"><label><em>*</em>通话智能体</label><select class="select" id="fAgent"></select><div class="err" id="eAgent"></div><div class="hint">本系统不创建、不编辑智能体，只需选择可用项。</div></div>
          <div class="form-item"><label><em>*</em>计划外呼量</label><input class="input" id="fPlan" type="number" min="1" max="99999" value="${t?t.plan:100}"><div class="err" id="ePlan"></div></div>
          <div class="form-item"><label><em>*</em>意向门槛</label><select class="select" id="fTh">${["A 及以上","B 及以上","C 及以上"].map(x=>`<option ${((t?t.threshold:"B 及以上")===x)?"selected":""}>${x}</option>`).join("")}</select><div class="hint">默认建议「B 及以上」，待确认。只使用一期 A–D 等级。</div></div>
        </div>
        <div class="section-title">并发配置</div>
        <div class="form-grid">
          <div class="form-item"><label>可分配并发</label><div>当前可分配 ${freeConcurrency()}，总并发 ${TOTAL_CONCURRENCY}${t&&t.status==="进行中"?"（含本任务已占用 "+t.concurrency+"）":""}</div></div>
          <div class="form-item"><label><em>*</em>并发模式</label><div>独占（本期仅此模式，任务预先占用并发，不被其他任务抢占）</div></div>
          <div class="form-item"><label><em>*</em>任务并发</label><input class="input" id="fConc" type="number" min="1" value="${t?t.concurrency:1}"><div class="err" id="eConc"></div></div>
        </div>
        <div class="section-title">时间配置</div>
        <div class="form-grid">
          <div class="form-item"><label><em>*</em>开始时间</label><input class="input" id="fStart" type="datetime-local" value="${esc(start)}"><div class="err" id="eStart"></div></div>
          <div class="form-item"><label><em>*</em>结束时间</label><input class="input" id="fEnd" type="datetime-local" value="${esc(end)}"><div class="err" id="eEnd"></div></div>
          <div class="form-item full"><label>政策禁呼说明</label><div class="hint">每日 21:00 至次日 09:00，系统均不可外呼。任务时间不能突破该时段。</div></div>
          <div class="form-item full"><label>禁拨时段</label><div id="fBlocks"></div><button type="button" class="btn btn-sm mt8" id="addBlock">添加禁拨时段</button><div class="err" id="eBlocks"></div></div>
          <div class="form-item"><label>未接再呼</label><label class="switch"><input type="checkbox" id="fRedial" ${t? (t.redial?"checked":"") :"checked"}><i></i></label><div class="hint">关闭则只打首次。只对未接通再建下一档。</div></div>
          <div class="form-item"><label>再呼次数 / 间隔（分钟）</label><div class="row"><input class="input" style="width:90px" id="fTimes" type="number" value="${t?t.redialTimes:2}"><input class="input" style="width:90px" id="fGap" type="number" value="${t?t.redialGap:30}"></div><div class="err" id="eRedial"></div></div>
        </div>
        <div class="section-title">线索分配比例（合计必须等于 100%）</div>
        <div class="ratio-row" id="fRatios">${["A","B","C","D","E"].map(k=>`<span>分层 ${k} <input class="input ratio" data-k="${k}" type="number" min="0" max="100" value="${ratios[k]}"></span>`).join("")}
          <button type="button" class="btn btn-sm" id="resetRatio">重置</button>
          <span id="ratioSum"></span>
        </div>
        <div class="err" id="eRatio"></div>
        <p class="hint">默认 5、15、5、5、70。占比为 0 的分层不抽取。计划量与比例分开填写。高净值、已是在岗销售企业微信好友、黑名单、空号等现网不可呼线索强制不抽取。</p>
      </div>
      <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn btn-primary" id="saveTask">确定</button></div>
    </div>`, ()=>{
      const blockBox=document.getElementById("fBlocks");
      const data={blocks};
      const paintBlocks=()=>{
        blockBox.innerHTML=data.blocks.map((b,i)=>`<div class="row mb8">
          <input class="input" data-bk="name" data-i="${i}" placeholder="名称" value="${esc(b.name||"")}">

          <input class="input" data-bk="end" data-i="${i}" type="time" value="${esc(b.end||"13:00")}">
          <button class="btn btn-sm" data-delb="${i}">删除</button>
        </div>`).join("")||'<span class="hint">可添加多条禁拨时段</span>';
      };
      paintBlocks();
      const fillAgents=()=>{
        const ch=document.getElementById("fChannel").value;
        const sel=document.getElementById("fAgent");
        const list=AGENTS[ch]||[];
        sel.innerHTML=`<option value="">请选择可用的通话智能体</option>`+list.map(a=>`<option value="${a.id}" ${t&&t.agent===a.id?"selected":""} ${a.ok?"":"disabled"}>${esc(a.name)}${a.ok?"":"（已停用）"}</option>`).join("");
      };
      fillAgents();
      document.getElementById("fChannel").onchange=fillAgents;
      document.getElementById("addBlock").onclick=()=>{data.blocks.push({name:"",start:"12:00",end:"13:00"});paintBlocks();};
      blockBox.addEventListener("click",e=>{if(e.target.dataset.delb){data.blocks.splice(+e.target.dataset.delb,1);paintBlocks();}});
      blockBox.addEventListener("input",e=>{const i=e.target.dataset.i,k=e.target.dataset.bk;if(k) data.blocks[i][k]=e.target.value;});
      const sumEl=()=>{
        const o=readRatios(); const s=o.A+o.B+o.C+o.D+o.E;
        document.getElementById("ratioSum").innerHTML=s===100?`<span class="ok-text">合计 ${s}%</span>`:`<span class="warn-text">合计 ${s}%（须等于 100% 才能创建）</span>`;
        return s;
      };
      document.getElementById("fRatios").addEventListener("input",sumEl);
      document.getElementById("resetRatio").onclick=()=>{document.querySelectorAll(".ratio").forEach(inp=>inp.value=({A:5,B:15,C:5,D:5,E:70}[inp.dataset.k]));sumEl();};
      sumEl();
      document.getElementById("saveTask").onclick=()=>submitTask(editId,data);
    });

function submitTask(editId,data){
  clearErr();
  let bad=false;
  const name=document.getElementById("fName").value.trim();
  if(!name){document.getElementById("eName").textContent="请填写任务名称";bad=true;}
  const dup=state.tasks.some(t=>t.name===name&&t.id!==editId&&t.status!=="已完成");
  if(name&&dup){document.getElementById("eName").textContent="任务名称不能重复";bad=true;}
  const channel=document.getElementById("fChannel").value;
  if(!channel){document.getElementById("eChannel").textContent="请选择通道";bad=true;}
  const agent=document.getElementById("fAgent").value;
  const ag=(AGENTS[channel]||[]).find(a=>a.id===agent);
  if(!ag||!ag.ok){document.getElementById("eAgent").textContent="请选择可用的通话智能体";bad=true;}
  const plan=Number(document.getElementById("fPlan").value);
  if(!Number.isInteger(plan)||plan<1||plan>99999){document.getElementById("ePlan").textContent="计划外呼量需为 1 到 99999 的整数";bad=true;}
  const old=editId?taskById(editId):null;
  if(old && plan<old.called){document.getElementById("ePlan").textContent="计划量不可改得小于已呼量";bad=true;}
  const cap=freeConcurrency()+(old&&old.status==="进行中"?old.concurrency:0);
  const conc=Number(document.getElementById("fConc").value);
  if(!Number.isInteger(conc)||conc<1||conc>cap){document.getElementById("eConc").textContent=`任务并发请输入 1–${cap} 的整数`;bad=true;}
  const start=document.getElementById("fStart").value, end=document.getElementById("fEnd").value;
  const ds=parseDT(start), de=parseDT(end);
  if(!(de>ds)){document.getElementById("eEnd").textContent="结束时间需晚于开始时间";bad=true;}
  if(de>ds && (inPolicy(ds)||inPolicy(de)||crossesPolicy(ds,de))){document.getElementById("eStart").textContent="任务时间不能突破每日 21:00 至次日 09:00 的政策禁呼时段";bad=true;}
  const blocks=data.blocks;
  let bmsg="";
  for(let i=0;i<blocks.length;i++){
    if(!blocks[i].start||!blocks[i].end||blocks[i].end<=blocks[i].start){bmsg="禁拨时段结束时间需晚于开始时间";break;}
    for(let j=0;j<i;j++){
      if(!(blocks[i].end<=blocks[j].start || blocks[i].start>=blocks[j].end)){bmsg="禁拨时段不可互相重叠";break;}
    }
  }
  if(bmsg){document.getElementById("eBlocks").textContent=bmsg;bad=true;}
  const redial=document.getElementById("fRedial").checked;
  const times=Number(document.getElementById("fTimes").value), gap=Number(document.getElementById("fGap").value);
  if(redial){
    if(!Number.isInteger(times)||times<0||times>4){document.getElementById("eRedial").textContent="再呼次数需为 0 到 4 的整数";bad=true;}
    else if(!Number.isInteger(gap)||gap<=0){document.getElementById("eRedial").textContent="再呼间隔需为正整数分钟";bad=true;}
  }
  const ratios=readRatios();
  const sum=ratios.A+ratios.B+ratios.C+ratios.D+ratios.E;
  if(sum!==100){document.getElementById("eRatio").textContent="合计须等于 100% 才能创建";bad=true;}
  if(bad) return;
  const payload={name,channel,agent,plan,called:old?old.called:0,connected:old?old.connected:0,intent:old?old.intent:0,status:old?old.status:"待开始",start,end,concurrency:conc,threshold:document.getElementById("fTh").value,ratios,redial,redialTimes:times,redialGap:gap,blocks,fails:old?old.fails:0,enough:old?old.enough:true,logs:old?old.logs.slice():[{t:fmt(state.now).slice(5),a:"创建任务"}],id:old?old.id:("T"+fmt(state.now).replace(/[-: ]/g,"").slice(0,8)+"-"+pad(state.tasks.length+1))};
  if(old){
    Object.assign(old,payload);
    old.logs.push({t:fmt(state.now).slice(5),a:"编辑"});
    toast("保存成功，立即生效");
  }else{
    if(ds<=state.now && de>state.now && !inPolicy(state.now)) payload.status="进行中";
    state.tasks.unshift(payload);
    toast("已创建 AI 外呼任务");
  }
  closeOverlay(); render();
}
function crossesPolicy(a,b){
  // if any minute in [a,b) falls in 21:00-09:00
  const cur=new Date(a);
  while(cur<b){if(inPolicy(cur)) return true; cur.setMinutes(cur.getMinutes()+30);}
  return inPolicy(b);
}

function visibleLeads(){
  let list=state.leads.slice();
  if(state.role==="sales"||state.role==="testseat"||state.role==="other") list=list.filter(l=>l.seat==="周敏");
  const v=state.poolView;
  if(v==="今日待跟进") list=list.filter(l=>l.aiIn && l.flow!=="人工智能处理中" && ["有效接通未加微","无效接通","未接通"].includes(l.aiStatus));
  if(v==="意向待分配") list=list.filter(l=>l.flow==="意向待分配");
  if(v==="已加微") list=list.filter(l=>l.flow==="已加微");
  if(v==="已分配") list=list.filter(l=>l.flow==="已分配");
  if(v==="人工智能处理中") list=list.filter(l=>l.flow==="人工智能处理中");
  const f=state.poolFilter;
  return list.filter(l=>{
    if(f.fid && !l.fid.includes(f.fid)) return false;
    if(f.oid && !l.oid.includes(f.oid)) return false;
    if(f.phone && !l.phone.includes(f.phone)) return false;
    if(f.task && l.task!==f.task) return false;
    if(f.aiStatus && l.aiStatus!==f.aiStatus) return false;
    if(f.grade && String(l.grade)!==f.grade) return false;
    if(f.flow && l.flow!==f.flow) return false;
    if(f.layer && l.layer!==f.layer) return false;
    if(f.wecom && l.wecom!==f.wecom) return false;
    return true;
  });
}

function openAddMember(){
  let q="",onf="全部";
  const already=new Set(state.members.map(m=>m.id));
  const paint=()=>{
    const list=seed.orgPeople.filter(p=>{
      if(q && !p.name.includes(q)&&!p.account.includes(q)) return false;
      if(onf==="在线"&&!p.online) return false;
      if(onf==="离线"&&p.online) return false;
      return true;
    });
    document.getElementById("orgList").innerHTML=list.map(p=>`<div class="org-item ${p.online?"":"off"}">
      <input type="checkbox" data-orgp="${p.id}" ${p.online?"":"disabled"} ${already.has(p.id)?"disabled":""}>
      <span class="avatar">${esc(p.name[0])}</span>
      <div><b>${esc(p.name)}</b> · ${esc(p.account)}<div class="muted">${esc(p.org)} · ${p.online?"在线":"离线"}</div></div>
    </div>`).join("")||'<div class="empty">没有符合条件的成员</div>';
    document.getElementById("orgList").onclick=e=>{
      const id=e.target.dataset.orgp; if(!id) return;
      const p=seed.orgPeople.find(x=>x.id===id);
      if(p&&!p.online){e.preventDefault();e.target.checked=false;toast("云设备离线，不可添加为承接成员","err");}
    };
  };
  showModal(`<div class="modal"><div class="modal-h"><span>组织架构选人</span><button class="close-x" data-close>×</button></div>
    <div class="modal-b">
      <div class="row mb12"><input class="input" id="orgQ" placeholder="搜索姓名或账号"><select class="select" id="orgOn"><option>全部</option><option>在线</option><option>离线</option></select></div>
      <div id="orgList"></div>
    </div>
    <div class="modal-f"><button class="btn" data-close>取消</button><button class="btn btn-primary" id="orgOk">确定</button></div></div>`,()=>{
      document.getElementById("orgQ").oninput=e=>{q=e.target.value.trim();paint();};
      document.getElementById("orgOn").onchange=e=>{onf=e.target.value;paint();};
      paint();
      document.getElementById("orgOk").onclick=()=>{
        const ids=[...document.querySelectorAll("[data-orgp]:checked")].map(x=>x.dataset.orgp);
        const picked=ids.map(id=>seed.orgPeople.find(p=>p.id===id)).filter(Boolean);
        if(!picked.length){toast("确定时至少选择一名在线成员","err");return;}
        if(picked.some(p=>!p.online)){toast("云设备离线，不可添加为承接成员","err");return;}
        const exist=picked.filter(p=>already.has(p.id));
        const fresh=picked.filter(p=>!already.has(p.id));
        if(!fresh.length){toast("所选成员已在列表中","warn");return;}
        fresh.forEach(p=>state.members.push({id:p.id,name:p.name,account:p.account,org:p.org,online:p.online,today:0,cap:state.policy.defaultCap,status:"启用",on:true}));
        toast(exist.length?`已新加 ${fresh.length} 人，其余已在列表中`:`已新加 ${fresh.length} 人`);
        closeOverlay(); render();
      };
    });
}

/* ---------- overlay / bind ---------- */
function showModal(html,after){showOverlay(html,after);}
function showDrawer(inner,after){showOverlay(`<div class="drawer">${inner}</div>`,after,true);}
function showOverlay(html,after,drawer){
  const box=document.getElementById("overlay");
  box.innerHTML=`<div class="mask" id="mask">${html}</div>`;
  const close=()=>closeOverlay();
  document.getElementById("mask").addEventListener("click",e=>{if(e.target.id==="mask") close();});
  box.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  if(after) after();
}
function closeOverlay(){document.getElementById("overlay").innerHTML="";}

function bindPage(){
  document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
  if(state.page==="tasks"){
    const ot=document.getElementById("obsToggle"); if(ot) ot.onclick=()=>{state.obsOpen=!state.obsOpen;render();};
    const q=()=>{state.taskFilter={name:val("tfName"),channel:val("tfChannel"),status:val("tfStatus"),date:""};render();};

    document.querySelectorAll("[data-act]").forEach(b=>{
      const id=b.dataset.id,act=b.dataset.act;
      b.onclick=()=>{
        if(act==="viewcust") viewCustomers(id);
        if(act==="detail") openTaskDetail(id);
        if(act==="edit") openTaskModal(id);
        if(act==="start") startTask(id);
        if(act==="pause") pauseTask(id);
      };
    });
  }
  if(state.page==="pool"){
    document.querySelectorAll("[data-view]").forEach(t=>t.onclick=()=>{state.poolView=t.dataset.view;state.selected=new Set();state.poolPage=1;render();});

    const pr=document.getElementById("pfReset"); if(pr) pr.onclick=()=>{state.poolFilter={fid:"",oid:"",phone:"",task:"",aiStatus:"",grade:"",flow:"",layer:"",wecom:""};state.poolView="全部客户";state.selected=new Set();state.poolPage=1;render();};
    const ps=document.getElementById("pfSaveView"); if(ps) ps.onclick=()=>toast("已另存为当前视图");
    const ba=document.getElementById("btnBatch"); if(ba) ba.onclick=()=>tryAssign([...state.selected]);
    const ap=document.getElementById("btnApply"); if(ap) ap.onclick=applyLead;
    const ca=document.getElementById("chkAll"); if(ca) ca.onchange=e=>{
      visibleLeads().forEach(l=>{if(l.flow==="意向待分配"||l.flow==="已加微"){if(e.target.checked) state.selected.add(l.fid); else state.selected.delete(l.fid);}});
      render();
    };
    document.querySelectorAll(".chk").forEach(c=>c.onchange=e=>{if(e.target.checked) state.selected.add(c.dataset.id); else state.selected.delete(c.dataset.id); render();});
    document.querySelectorAll("[data-act]").forEach(b=>{
      const act=b.dataset.act,id=b.dataset.id;
      b.onclick=()=>{
        if(act==="assign"){ if(!(state.leads.find(l=>l.fid===id).flow==="意向待分配"||state.leads.find(l=>l.fid===id).flow==="已加微")) toast("当前流转状态不可分配","err"); else tryAssign([id]); }
        if(act==="call") oneClickCall(id);
        if(act==="detailc") openCustomer(id);
      };
    });
    const prev=document.getElementById("pgPrev"), next=document.getElementById("pgNext");
    if(prev) prev.onclick=()=>{state.poolPage--;render();};
    if(next) next.onclick=()=>{state.poolPage++;render();};
  }
  if(state.page==="wecom"){
    document.querySelectorAll("[data-wtab]").forEach(t=>t.onclick=()=>{collectPolicy();state.wecomTab=t.dataset.wtab;render();});
    document.querySelectorAll("[data-org]").forEach(c=>c.onclick=()=>{state.orgFilter=c.dataset.org;render();});
    const rd=document.getElementById("btnRefreshDev"); if(rd) rd.onclick=()=>{toast("已刷新云设备与活码状态");render();};
    const am=document.getElementById("btnAddMem"); if(am) am.onclick=openAddMember;

    document.querySelectorAll("[data-editcap]").forEach(b=>b.onclick=()=>editCap(b.dataset.editcap));
    const ex=document.getElementById("pExempt"); if(ex) ex.onchange=maybeExemptOff;
  }
}

  if(q.get("role")){state.role=q.get("role");const s=document.getElementById("roleSel");if(s)s.value=state.role;}
  if(q.get("sim")==="night") state.now=new Date(2026,10,12,21,30,0);
  if(q.get("view")) state.poolView=q.get("view");
  if(q.get("task")) state.poolFilter.task=q.get("task");
  if(q.get("wtab")) state.wecomTab=q.get("wtab");
  const page=q.get("page");
  if(page) setPage(page);
  else render();
  const shot=q.get("shot");
  if(shot==="newtask") openTaskModal();
  if(shot==="edittask") openTaskModal("T20261112-001");
  if(shot==="detail") openTaskDetail("T20261112-001");
  if(shot==="assign") tryAssign(["F10021"]);
  if(shot==="cust") openCustomer("F10021");
  if(shot==="addmem") {state.page="wecom";render();openAddMember();}
  if(shot==="apply") {state.page="pool";render();applyLead();}
})();
</script>
